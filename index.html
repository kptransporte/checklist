<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a5cff">
<title>KP CHECKLIST</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* KP CHECKLIST · visual de pátio: letras grandes, alto contraste no sol, um assunto por tela, botão largo embaixo. */
:root{--azul:#0a5cff;--azul2:#0842b8;--verm:#e6261f;--verde:#00a05a;--amar:#ffb400;--fundo:#eef1f5;--card:#fff;--tinta:#101418;--mut:#5b6370;--linha:#dde2e8;--vermc:#fdecea;--verdec:#e3f6ec;--amarc:#fff4d6;--sombra:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.07);--r:18px}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font:18px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
header{background:linear-gradient(135deg,var(--azul),var(--azul2));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(8,66,184,.25)}
.marca{display:flex;align-items:center;gap:10px}
.marca img{width:34px;height:34px;border-radius:9px;background:#fff}
.marca b{display:block;font-size:18px;letter-spacing:.03em;line-height:1.1}
.marca small{display:block;font-size:12px;opacity:.85;line-height:1.2}
#rede{font-size:13px;font-weight:700;background:rgba(255,255,255,.18);border-radius:99px;padding:6px 11px;white-space:nowrap;display:flex;align-items:center;gap:6px}
#rede::before{content:"";width:8px;height:8px;border-radius:50%;background:#5ee39b}
#rede.off{background:var(--amar);color:#111}#rede.off::before{background:#b45309}
main{max-width:640px;margin:0 auto;padding:18px 16px calc(120px + env(safe-area-inset-bottom))}
main.largo{max-width:1180px}
h1{font-size:27px;line-height:1.15;margin:4px 0 6px;letter-spacing:-.01em}
h2{font-size:20px;margin:18px 0 8px}
p{margin:6px 0}
.mut{color:var(--mut);font-size:15px}
.passo{font-size:13px;font-weight:800;color:var(--azul);letter-spacing:.04em}
.barra{display:flex;gap:5px;margin:8px 0 16px}.barra i{flex:1;height:6px;border-radius:9px;background:var(--linha)}.barra i.f{background:var(--azul)}
label{display:block;font-weight:700;font-size:16px;margin:16px 0 6px}
label small{font-weight:400;color:var(--mut)}
input,textarea,select{width:100%;font:inherit;font-size:20px;padding:14px;border:2px solid var(--linha);border-radius:14px;background:#fff;color:var(--tinta);min-height:58px;transition:border-color .15s,box-shadow .15s}
select{font-size:18px}
textarea{min-height:96px;font-size:18px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 4px rgba(10,92,255,.15)}
input.placa{text-transform:uppercase;font-weight:800;letter-spacing:.1em;font-size:28px;text-align:center;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#1d3a8a,#0a5cff) border-box;border:3px solid transparent}
input.erro{border-color:var(--verm);background:var(--vermc)}
button{font:inherit;font-weight:800;border:0;border-radius:14px;min-height:56px;padding:12px 18px;cursor:pointer;background:var(--linha);color:var(--tinta);transition:transform .08s,filter .15s}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
.grande{width:100%;font-size:21px;min-height:68px;background:var(--azul);color:#fff;margin-top:12px;box-shadow:0 6px 16px rgba(10,92,255,.28);display:flex;align-items:center;justify-content:center;gap:10px}
.grande svg{width:28px;height:28px}
.contorno{background:#fff;color:var(--azul);border:2px solid var(--azul);box-shadow:none}
.verde{background:var(--verde);color:#fff}.azul{background:var(--azul);color:#fff}.vermelho{background:var(--verm);color:#fff}.amarelo{background:var(--amar);color:#111}
.link{background:none;color:var(--azul);min-height:44px;padding:8px 0;font-weight:700}
.rodape{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:4}
.rodape>div{max-width:640px;margin:0 auto;display:flex;gap:10px;width:100%}
.rodape button{flex:1;min-height:62px;font-size:19px}
.rodape .prox{flex:2;background:var(--azul);color:#fff;box-shadow:0 6px 16px rgba(10,92,255,.25)}
.rodape .prox.verde{background:var(--verde);box-shadow:0 6px 16px rgba(0,160,90,.25)}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:var(--sombra)}
.heroi{display:flex;align-items:center;gap:14px}
.avatar{flex:none;width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--azul),#6a9bff);color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}
.status{border-radius:16px;padding:14px 16px;margin:12px 0;font-weight:700;display:flex;gap:12px;align-items:flex-start}
.status svg{flex:none;width:24px;height:24px;margin-top:1px}
.status.ok{background:var(--verdec);color:#05663a}.status.pend{background:var(--amarc);color:#6b4b00}.status.erro{background:var(--vermc);color:#a3110b}
.retorno{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--amar);color:#111;border-radius:var(--r);padding:16px;margin:12px 0;min-height:0;box-shadow:0 6px 16px rgba(255,180,0,.3)}
.retorno svg{flex:none;width:40px;height:40px}
.retorno b{display:block;font-size:26px;letter-spacing:.06em}
.retorno span{display:block;font-size:15px}
.escolha{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:#fff;border-radius:var(--r);padding:20px;margin:14px 0;box-shadow:var(--sombra);border:2px solid transparent;color:var(--tinta)}
.escolha:hover{border-color:var(--azul)}
.escolha .ic{flex:none;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;color:#fff}
.escolha .ic svg{width:36px;height:36px}
.escolha b{display:block;font-size:22px}.escolha span{display:block;font-size:15px;color:var(--mut);font-weight:500}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.foto{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:4/3;border:3px dashed #9db8ff;border-radius:16px;background:#f5f8ff;color:var(--azul);font-weight:800;font-size:16px;text-align:center;padding:8px;cursor:pointer;overflow:hidden;margin:0}
.foto input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;cursor:pointer}
.foto.tem{border:3px solid var(--verde);padding:0;color:#fff}
.foto.tem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto.tem span{position:absolute;left:0;right:0;bottom:0;background:rgba(0,160,90,.92);padding:5px;font-size:14px}
.foto.falta{border-color:var(--verm);color:var(--verm);background:var(--vermc)}
.foto svg{width:40px;height:40px}
.av{display:flex;gap:10px;align-items:center;margin:10px 0}
.av img{width:84px;height:84px;object-fit:cover;border-radius:12px;flex:none}
.av input{font-size:17px;min-height:52px;padding:10px}
.av button{flex:none;min-height:52px;padding:6px 12px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 14px;margin:8px 0;min-height:62px;font-weight:700;font-size:18px;color:var(--tinta);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.item i{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;color:#fff;background:var(--verde);font-size:18px}
.item.nok{border-color:var(--verm);background:var(--vermc);color:var(--verm)}
.item.nok i{background:var(--verm)}
.item em{margin-left:auto;font-style:normal;font-size:13px;color:var(--mut);font-weight:700}
.nokdesc{margin:-2px 0 12px;border-color:var(--verm)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo button{min-height:74px;font-size:22px;border:3px solid transparent;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.duo button.on{border-color:var(--tinta)}
.duo button.on.verde,.duo button.on.azul,.duo button.on.vermelho{color:#fff}
.duo button.on.verde{background:var(--verde)}.duo button.on.azul{background:var(--azul)}.duo button.on.vermelho{background:var(--verm)}.duo button.on.amarelo{background:var(--amar)}
.temp{display:flex;gap:8px}
.temp button{flex:none;width:76px;font-size:26px}
.temp input{text-align:center;font-size:28px;font-weight:800}
.alerta{background:var(--vermc);color:var(--verm);border-radius:14px;padding:12px 14px;font-weight:800;margin-top:10px}
.bom{background:var(--verdec);color:#05663a;border-radius:14px;padding:12px 14px;font-weight:800;margin-top:10px}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}dt{color:var(--mut);font-size:15px}dd{margin:0;font-weight:700;overflow-wrap:anywhere}
canvas{display:block;width:100%;height:170px;background:#fff;border:2px dashed var(--linha);border-radius:14px;touch-action:none}
details{margin-top:14px}summary{font-weight:700;color:var(--azul);min-height:44px;display:flex;align-items:center;cursor:pointer}
.ok-grande{text-align:center;padding:24px 0}
.ok-grande .circ{width:116px;height:116px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.ok-grande .circ svg{width:64px;height:64px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111;color:#fff;padding:14px 18px;border-radius:14px;font-weight:700;z-index:9;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center;font-size:16px}
.toast.on{opacity:1}
/* escritório */
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.abas{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:2px;scrollbar-width:none}
.abas button{flex:none;min-height:44px;padding:8px 14px;font-size:15px;background:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08)}
.abas button.on{background:var(--tinta);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sombra);border-top:4px solid var(--linha)}
.kpi b{display:block;font-size:32px;line-height:1.1}.kpi span{font-size:14px;color:var(--mut)}
.kpi.k-rota{border-color:var(--amar)}.kpi.k-aguard{border-color:#6a9bff}.kpi.k-vm{border-color:var(--verm)}.kpi.k-vm b{color:var(--verm)}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}
.filtros input,.filtros select{font-size:16px;min-height:50px;padding:10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:10px}
.linhaadm{display:block;width:100%;text-align:left;background:#fff;border-left:6px solid var(--linha);border-radius:16px;padding:14px 16px;margin:0;font-weight:400;min-height:0;box-shadow:var(--sombra);color:var(--tinta)}
.linhaadm.v{border-left-color:var(--verm)}
.linhaadm b{font-size:20px;letter-spacing:.04em}
.tag{display:inline-block;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap}
.t-rota{background:var(--amar)}.t-aguard{background:#cfe0ff;color:#0842b8}.t-val{background:var(--verde);color:#fff}.t-rep{background:var(--verm);color:#fff}.t-sem{background:var(--linha)}
.t-dev{background:#111;color:#fff}.t-adm{background:#cfe0ff;color:#0842b8}.t-dir{background:#ffe7a3;color:#6b4b00}.t-off{background:var(--linha);color:var(--mut)}
.det{display:grid;grid-template-columns:1fr;gap:12px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.galeria figure{margin:0;background:#fff;border:1px solid var(--linha);border-radius:12px;overflow:hidden}
.galeria img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--linha);cursor:zoom-in}
.galeria figcaption{font-size:13px;padding:5px 7px;color:var(--mut)}
table.reg{width:100%;border-collapse:collapse;font-size:15px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
table.reg th,table.reg td{padding:10px;border-bottom:1px solid var(--linha);text-align:left;vertical-align:top}
table.reg th{font-size:13px;color:var(--mut);background:#f7f8fa}
.usu{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px;margin:8px 0;box-shadow:var(--sombra);flex-wrap:wrap}
.usu .nm{flex:1 1 180px}
.usu .acoes{display:flex;gap:6px;flex-wrap:wrap}
.usu .acoes button,.usu .acoes select{min-height:44px;font-size:15px;padding:8px 12px;width:auto}
.perigo{border:2px solid var(--verm);background:var(--vermc);border-radius:16px;padding:14px;margin-top:10px}
#zoom{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:20}
#zoom img{max-width:100%;max-height:100%}
#zoom.on{display:flex}
@media(min-width:900px){.det{grid-template-columns:1fr 1fr}.det .inteiro{grid-column:1/-1}}
@media(max-width:600px){.filtros{grid-template-columns:1fr 1fr}.filtros>:first-child{grid-column:1/-1}
 table.reg thead{display:none}table.reg tr{display:block;padding:8px 0;border-bottom:1px solid var(--linha)}table.reg td{display:block;border:0;padding:2px 12px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="marca"><img src="icon-192.png" alt=""><div><b>KP CHECKLIST</b><small>KP Transportes Ltda.</small></div></div><span id="rede">…</span></header>
<main id="app"><p class="mut">Carregando…</p></main>
<div id="rod"></div>
<div class="toast" id="toast"></div>
<div id="zoom" role="dialog"><img alt="Foto ampliada"></div>
<script src="config.js"></script>
<script src="sync.js"></script>
<script>
{
const C=self.KP_CONFIG,F=self.KPFila;
const ITENS=["Luzes do painel","Faróis","Lanterna","Extintor","Setas e pisca-alerta","Triângulo","Chave de roda","Macaco","Estepe","Documento do caminhão","CNH do motorista","Cinto de segurança","Espelhos retrovisores","Limpador de para-brisa","Hodômetro","Rastreador","Marcador de combustível","Água do radiador","Nível de óleo","Fluido de freio","Equipamento de frio"];
const FOTOS=[["frente","Frente do caminhão"],["traseira","Traseira (portas do baú)"],["esquerda","Lado esquerdo"],["direita","Lado direito"],["carrinho","Carrinho de entrega"]];
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h4l2-3h6l2 3h4v12H3z"/><circle cx="12" cy="13" r="4"/></svg>';
let tela="inicio",passo=0,R=null,instalar=null,ultimoEnvio=null,adm=null,admDados=null,admSel=null,fotoCache={};
const IC={
 caminhao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 6h11v10H2zM13 9h4l4 4v3h-8z"/><circle cx="6" cy="17.5" r="2" fill="currentColor"/><circle cx="17" cy="17.5" r="2" fill="currentColor"/></svg>',
 predio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" width="30" height="30"><path d="M4 21V5l8-3v19M12 9l8 3v9M2 21h20M7 8h2M7 12h2M7 16h2M15 14h2M15 17h2"/></svg>',
 ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
 nuvem:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a5 5 0 1 1 .9-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/><path d="M12 12v5M9.5 14.5L12 12l2.5 2.5"/></svg>',
 relogio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 mais:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 baixar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>'
};
const iniciais=n=>String(n||"").trim().split(/\s+/).filter(Boolean).map((x,i,a)=>i===0||i===a.length-1?x[0]:"").join("").toUpperCase().slice(0,2)||"?";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const hora=()=>{const d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes())};
const br=s=>s?String(s).split("-").reverse().join("/"):"";
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,20);
const normPlaca=p=>String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const num=v=>{const s=String(v??"").trim().replace(",",".");if(!s)return null;const n=parseFloat(s);return isNaN(n)?null:n};
const soDig=s=>String(s||"").replace(/\D/g,"");
function cpfOk(c){c=soDig(c);if(c.length!==11||/^(\d)\1+$/.test(c))return false;for(const t of[9,10]){let s=0;for(let i=0;i<t;i++)s+=+c[i]*(t+1-i);if(((s*10)%11)%10!==+c[t])return false}return true}
const cpfFmt=c=>{c=soDig(c).slice(0,11);return c.replace(/^(\d{3})(\d)/,"$1.$2").replace(/^(\d{3})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1-$2")};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),3500)}
const temp=(v,neg)=>{const n=num(v);return n==null||neg==null?null:(neg?-Math.abs(n):Math.abs(n))};
const fora=(t,f)=>{const mi=num(f.exigMin),ma=num(f.exigMax);return t!=null&&((mi!=null&&t<mi)||(ma!=null&&t>ma))};
let salvarT;function salvar(ja){clearTimeout(salvarT);const f=()=>{if(R&&R.tipo)return F.salvarRascunho(R).catch(()=>{})};if(ja)return f();salvarT=setTimeout(f,300)}
addEventListener("pagehide",()=>salvar(true));document.addEventListener("visibilitychange",()=>{if(document.hidden)salvar(true)});

/* ================= rede e fila ================= */
async function atualizarRede(){
 const pend=(await F.lista().catch(()=>[])).length;
 const e=$("#rede");const on=navigator.onLine;
 e.className=on?"":"off";e.textContent=(on?"Online":"Sem internet")+(pend?" · "+pend+" na fila":"");
 return pend;
}
async function enviarFila(manual){
 if(!C.API_URL){if(manual)toast("App ainda não configurado. Avise o administrativo.");return}
 const r=await F.enviarTudo();ultimoEnvio=r;await atualizarRede();
 if(manual){toast(r.pendentes?(r.erro==="rede"?"Sem internet. Vai enviar sozinho quando o sinal voltar.":"O escritório ainda não recebeu ("+r.erro+"). Avise o administrativo."):"Tudo enviado!")}
 if(r.enviados&&tela==="inicio")render();
 if(r.enviados&&tela==="fim"){render()}
}
function pedirSyncFundo(){if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(sw=>sw.sync&&sw.sync.register("kp-enviar")).catch(()=>{})}
addEventListener("online",()=>{atualizarRede();enviarFila()});
addEventListener("offline",atualizarRede);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)enviarFila()});
setInterval(()=>{if(navigator.onLine)enviarFila()},60000);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();instalar=e;if(tela==="inicio")render()});

/* ================= fotos ================= */
async function processarFoto(file,legenda){
 let fonte;
 try{fonte=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){fonte=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(file)})}
 const W=fonte.width,H=fonte.height,k=Math.min(1,1280/Math.max(W,H));
 const c=document.createElement("canvas");c.width=Math.round(W*k);c.height=Math.round(H*k);
 const x=c.getContext("2d");x.drawImage(fonte,0,0,c.width,c.height);
 const fs=Math.max(16,Math.round(c.width/34)),bh=Math.round(fs*1.9);
 x.fillStyle="rgba(0,0,0,.65)";x.fillRect(0,c.height-bh,c.width,bh);
 x.fillStyle="#fff";x.font="bold "+fs+"px sans-serif";x.textBaseline="middle";
 const d=new Date();x.fillText(legenda+" · "+p2(d.getDate())+"/"+p2(d.getMonth()+1)+"/"+d.getFullYear()+" "+p2(d.getHours())+":"+p2(d.getMinutes()),Math.round(fs*.6),c.height-bh/2,c.width-fs);
 fonte.close&&fonte.close();
 return c.toDataURL("image/jpeg",0.7).split(",")[1];
}

function iniciarAssinatura(){
 const c=$("#ass");const x=c.getContext("2d");x.lineWidth=3.5;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#111";let on=false;
 if(R.assinatura){const i=new Image();i.onload=()=>x.drawImage(i,0,0,c.width,c.height);i.src="data:image/png;base64,"+R.assinatura}
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b)};
 c.onpointermove=e=>{if(!on)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();R._assinou=true};
 c.onpointerup=c.onpointercancel=()=>{if(on){on=false;R.assinatura=c.toDataURL("image/png").split(",")[1];salvar()}};
}
function validarPasso(p){
 const f=[];
 if(p==="caminhao"||p==="placa"){const pl=normPlaca(R.placa);if(pl.length<7)f.push("a placa (7 letras e números)");}
 if(p==="caminhao"||p==="chegada"){const k=num(R.km);if(k==null)f.push("o km do painel");else if(p==="chegada"&&num(R.kmSaida)!=null&&k<num(R.kmSaida))f.push("o km (está menor que na saída)")}
 if(p==="chegada"){if(num(R.clientesRet)==null)f.push("quantas entregas voltaram (0 se nenhuma)");if(num(R.pesoRet)==null)f.push("o peso que voltou (0 se nada)");if(R.divergencia.houve==null)f.push("se teve divergência na rota");else if(R.divergencia.houve&&!String(R.divergencia.desc).trim())f.push("o que aconteceu na divergência")}
 if(p==="caminhao"&&!R.semAjudante&&!String(R.ajudante).trim())f.push("o nome do ajudante (ou toque em \"Estou sem ajudante\")");
 if(p==="fotos"){R._falta=FOTOS.map(x=>x[0]).filter(k=>!R.fotos[k]);if(R._falta.length)f.push("as fotos marcadas em vermelho");if(R.avarias.some(a=>!String(a.desc).trim()))f.push("o que é cada avaria")}
 if(p==="itens"){const s=Object.keys(R.nok).filter(k=>!String(R.nok[k]).trim());if(s.length)f.push("o problema em: "+s.join(", "))}
 if(p==="frio"){const fr=R.frio;if(R.tipo==="saida"&&!fr.usa)f.push("se o baú é refrigerado");if(fr.usa==="sim"){if(num(fr.t)==null)f.push("a temperatura");else if(fr.neg==null)f.push("se a temperatura é abaixo ou acima de zero");if(!fr.aparelho)f.push("se o aparelho está funcionando")}}
 if(p==="final"&&!R.assinatura)f.push("a assinatura");
 if(f.length){toast("Falta: "+f.join("; "));if(p==="fotos")render();return false}
 return true;
}
async function enviarRegistro(){
 const P=passos();for(let i=0;i<P.length;i++)if(!validarPasso(P[i])){passo=i;render();return}
 const f=R.frio,reg={tipo:R.tipo,id:R.id,criadoEm:R.criadoEm,enviadoEm:new Date().toISOString(),versao:C.VERSAO,data:R.data,hora:R.hora,motorista:R.motorista,placa:normPlaca(R.placa),km:num(R.km),fotos:R.fotos,avarias:R.avarias.map(a=>({desc:String(a.desc).trim(),foto:a.foto})),obs:String(R.obs||"").trim(),gps:R.gps||null};
 if(R.tipo==="saida")Object.assign(reg,{ajudante:R.semAjudante?"":R.ajudante.trim(),transporte:R.transporte.trim(),lacre:R.lacre.trim(),clientes:num(R.clientes),peso:R.peso.trim(),itensNok:R.nok,frio:f.usa==="sim"?{temp:temp(f.t,f.neg),exigMin:f.exigMin,exigMax:f.exigMax,aparelho:f.aparelho}:null});
 else Object.assign(reg,{semSaidaNoCelular:R.outroCelular,clientesRet:num(R.clientesRet),pesoRet:String(R.pesoRet||"").trim(),divergencia:{houve:!!R.divergencia.houve,desc:String(R.divergencia.desc||"").trim()},frio:f.usa==="sim"?{temp:temp(f.t,f.neg),aparelho:f.aparelho,exigMin:f.exigMin,exigMax:f.exigMax}:null,assinatura:R.assinatura});
 const b=document.querySelector('[data-a="enviar-reg"]');if(b){b.disabled=true;b.textContent="Guardando…"}

 else if(!v.situacao)h+='<p class="mut">Aguardando o Administrativo validar.</p>';
 if(l.pasta&&/^https:\/\/drive\.google\.com\//.test(l.pasta))h+='<p><a class="link" href="'+esc(l.pasta)+'" target="_blank" rel="noopener">Abrir pasta de fotos no Drive</a></p>';
 if(pode.apagar())h+=confApagar?'<div class="perigo"><b>Apagar este check-list?</b><p class="mut">Ele sai da lista e vai para a aba "Lixeira" da planilha, com seu nome e a hora. As fotos vão para a lixeira do Drive (dá para recuperar por 30 dias).</p><label for="adm-mot">Motivo</label><input id="adm-mot" placeholder="Ex.: teste, preenchido errado, duplicado"><div class="duo" style="margin-top:10px"><button data-x="nao-apagar">Cancelar</button><button class="on vermelho" data-x="apagar">Apagar</button></div></div>':'<button class="link" style="color:var(--verm);margin-top:8px" data-x="pedir-apagar">Apagar este check-list</button>';
 h+='</div></div>';
 corpo().innerHTML=h;
 carregarFotos();
}
async function carregarFotos(){
 for(const im of document.querySelectorAll("img[data-fid]")){
  const id=im.dataset.fid;if(!/^[A-Za-z0-9_-]{10,80}$/.test(id))continue;
  if(!fotoCache[id]){try{const j=await api("foto",{id});fotoCache[id]="data:"+(j.tipo==="image/png"?"image/png":"image/jpeg")+";base64,"+j.b64}catch(e){continue}}
  if(document.body.contains(im))im.src=fotoCache[id];
 }
}
async function admValidar(sit,b){
 const com=$("#adm-com").value.trim();if(sit==="Reprovado"&&!com){toast("Escreva o motivo da reprovação");return}
 b.disabled=true;
 try{const j=await api("validar",{id:admSel,situacao:sit,comentario:com});const l=admDados.linhas.find(x=>x.id===admSel);if(l){l.situacao=sit;l.validacao=j.validacao}toast(sit==="Validado"?"Check-list validado":"Check-list reprovado");render()}
 catch(e){toast(e.message);b.disabled=false}
}
async function admApagar(b){
 const motivo=$("#adm-mot").value.trim();if(!motivo){toast("Escreva o motivo");return}
 b.disabled=true;b.textContent="Apagando…";
 try{await api("apagar",{id:admSel,motivo});admDados.linhas=admDados.linhas.filter(x=>x.id!==admSel);admSel=null;confApagar=false;tela="adm";toast("Check-list apagado (está na Lixeira da planilha)");render()}
 catch(e){toast(e.message);b.disabled=false;b.textContent="Apagar"}
}
/* usuários (só Dev) */
async function admUsuarios(){
 if(!admUsu){corpo().innerHTML='<p class="mut">Carregando usuários…</p>';try{admUsu=(await api("usuarios")).usuarios}catch(e){corpo().innerHTML='<div class="status erro">'+esc(e.message)+'</div>';return}if(admAba!=="usuarios"||!corpo())return}
 const ord={dev:0,adm:1,dir:2},L=[...admUsu].sort((a,b)=>(b.ativo-a.ativo)||(ord[a.perfil]-ord[b.perfil])||a.nome.localeCompare(b.nome));
 let h='<div class="det"><div class="card"><h2 style="margin-top:0">Cadastrar pessoa</h2><p class="mut">A pessoa entra com este nome e esta senha, e pode trocar a senha depois em "Minha senha".</p><label for="u-nome">Nome e sobrenome</label><input id="u-nome" placeholder="Ex.: Ana Souza"><label for="u-perfil">Perfil</label><select id="u-perfil"><option value="adm">Administrativo (vê, valida e apaga)</option><option value="dir">Diretoria (vê tudo)</option><option value="dev">Dev (tudo, inclusive usuários)</option></select><label for="u-senha">Senha inicial</label><input id="u-senha" placeholder="Pelo menos 6 caracteres" autocomplete="off"><button class="grande" data-x="criar-usu">Cadastrar</button></div>';
 h+='<div class="card"><h2 style="margin-top:0">Pessoas cadastradas ('+L.filter(u=>u.ativo).length+' ativas)</h2>'+L.map(u=>'<div class="usu" style="box-shadow:none;border:1px solid var(--linha)'+(u.ativo?'':';opacity:.6')+'"><div class="nm"><b>'+esc(u.nome)+'</b>'+(u.eu?' <small class="mut">(você)</small>':'')+'<br><span class="tag t-'+(u.ativo?esc(u.perfil):"off")+'">'+(u.ativo?PAPEL[u.perfil]:"Desativado")+'</span> <small class="mut">'+(u.ultimo?"último acesso "+esc(u.ultimo):"nunca entrou")+'</small></div>'+(u.eu?'':'<div class="acoes"><select data-perfil="'+esc(u.id)+'" aria-label="Perfil">'+Object.entries(PAPEL).map(([k,n])=>'<option value="'+k+'"'+(u.perfil===k?" selected":"")+'>'+n+'</option>').join('')+'</select><button data-x="senha-usu" data-id="'+esc(u.id)+'">Nova senha</button><button class="'+(u.ativo?"vermelho":"verde")+'" data-x="ativo-usu" data-id="'+esc(u.id)+'" data-v="'+(u.ativo?0:1)+'">'+(u.ativo?"Desativar":"Reativar")+'</button></div>')+'<div id="ns-'+esc(u.id)+'" style="flex-basis:100%"></div></div>').join('')+'</div></div>';
 corpo().innerHTML=h;
}
async function admSalvarUsu(dados,b){
 if(b)b.disabled=true;
 try{await api("usuario_salvar",dados);toast("Salvo");admUsu=null;admUsuarios()}catch(e){toast(e.message);if(b)b.disabled=false;if(dados.perfil&&b){admUsu=null;admUsuarios()}}
}
/* registro de acessos (só Dev) */
async function admRegistro(){
 corpo().innerHTML='<p class="mut">Carregando registro…</p>';
 try{admReg=(await api("registro")).linhas}catch(e){corpo().innerHTML='<div class="status erro">'+esc(e.message)+'</div>';return}
 if(admAba!=="registro"||!corpo())return;
 corpo().innerHTML='<p class="mut">Últimos '+admReg.length+' registros. O histórico completo fica na aba "Registro de acessos" da planilha.</p><table class="reg"><thead><tr><th>Quando</th><th>Quem</th><th>Perfil</th><th>O que fez</th><th>Detalhe</th></tr></thead><tbody>'+admReg.map(r=>'<tr><td style="white-space:nowrap">'+esc(r[0])+'</td><td><b>'+esc(r[1])+'</b></td><td>'+esc(r[2])+'</td><td style="'+(/recusado|Apagou|Desativou/.test(r[3])?"color:var(--verm);font-weight:700":"")+'">'+esc(r[3])+'</td><td class="mut">'+esc(r[4])+'</td></tr>').join('')+'</tbody></table>';
}
function admSenha(){
 corpo().innerHTML='<div class="card" style="max-width:460px"><h2 style="margin-top:0">Trocar minha senha</h2><label for="s-atual">Senha atual</label><input id="s-atual" type="password" autocomplete="current-password"><label for="s-nova">Nova senha</label><input id="s-nova" type="password" autocomplete="new-password" placeholder="Pelo menos 6 caracteres"><label for="s-nova2">Repita a nova senha</label><input id="s-nova2" type="password" autocomplete="new-password"><button class="grande" data-x="trocar-senha">Trocar senha</button></div>';
}
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-x]");if(!b)return;const x=b.dataset.x;
 switch(x){
  case"entrar":return admEntrar(b);
  case"app":document.querySelector("main").classList.remove("largo");LS.set("kp-modo","motorista");tela="inicio";return render();
  case"sair":try{await api("sair")}catch(e){}adm=null;LS.set("kp-adm",null);admDados=null;admUsu=null;tela="adm";return render();
  case"aba":admAba=b.dataset.v;tela="adm";if(admAba==="usuarios")admUsu=null;return render();
  case"atualizar":admDados=null;return admCarregar();
  case"abrir":admSel=b.dataset.id;confApagar=false;tela="adm-det";return render();
  case"voltar":admSel=null;confApagar=false;tela="adm";return render();
  case"validar":return admValidar(b.dataset.v,b);
  case"pedir-apagar":confApagar=true;admDetalhe();{const i=$("#adm-mot");if(i)i.focus()}return;
  case"nao-apagar":confApagar=false;return admDetalhe();
  case"apagar":return admApagar(b);
  case"criar-usu":{const nome=$("#u-nome").value.trim(),senha=$("#u-senha").value;if(nome.split(/\s+/).length<2){toast("Escreva nome e sobrenome");return}if(senha.length<6){toast("A senha precisa ter pelo menos 6 caracteres");return}return admSalvarUsu({nome,perfil:$("#u-perfil").value,senha},b)}
  case"ativo-usu":return admSalvarUsu({id:b.dataset.id,ativo:b.dataset.v==="1"},b);
  case"senha-usu":{const d=$("#ns-"+CSS.escape(b.dataset.id));d.innerHTML='<div style="display:flex;gap:8px;margin-top:8px"><input id="nsv-'+esc(b.dataset.id)+'" placeholder="Nova senha (mín. 6)" style="min-height:48px;font-size:16px"><button class="azul" data-x="salvar-ns" data-id="'+esc(b.dataset.id)+'">Salvar</button></div>';$("#nsv-"+CSS.escape(b.dataset.id)).focus();return}
  case"salvar-ns":{const v=$("#nsv-"+CSS.escape(b.dataset.id)).value;if(v.length<6){toast("A senha precisa ter pelo menos 6 caracteres");return}return admSalvarUsu({id:b.dataset.id,senha:v},b)}
  case"trocar-senha":{const a=$("#s-atual").value,n=$("#s-nova").value;if(n.length<6){toast("A nova senha precisa ter pelo menos 6 caracteres");return}if(n!==$("#s-nova2").value){toast("As duas senhas novas não são iguais");return}b.disabled=true;try{const j=await api("minha_senha",{atual:a,nova:n});adm.token=j.token;LS.set("kp-adm",adm);toast("Senha trocada");admSenha()}catch(err){toast(err.message);b.disabled=false}return}
 }
});

/* ================= início ================= */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.hash==="#admin"||LS.get("kp-modo","")==="escritorio"||LS.get("kp-adm",null))tela="adm";
else if(!LS.get("kp-modo","")&&!motorista())tela="entrada";
render();atualizarRede();setTimeout(()=>enviarFila(),1500);
}
</script>
</body>
</html>
